name: stock-watch
on:
  schedule:
    # 北京时间08:00 早报 → UTC 0点
    - cron: '0 0 * * 1-5'
    # 北京时间09:00-15:00 每5分钟告警 → UTC 1点~7点
    - cron: '*/5 1-7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        required: true
        default: 'alert'
        type: choice
        options:
          - alert
          - report

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CORP_ID: ${{ secrets.CORP_ID }}
      CORP_SECRET: ${{ secrets.CORP_SECRET }}
      AGENT_ID: ${{ secrets.AGENT_ID }}
      TO_USER: ${{ secrets.TO_USER }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          pip install akshare requests
      - name: 执行脚本
        run: python stock_alert.py ${{ github.event.inputs.mode || 'alert' }}
